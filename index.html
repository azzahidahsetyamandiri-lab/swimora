<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swimora - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0066ff,#00c6ff);overflow:hidden}
.circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.15)}
.one{width:300px;height:300px;top:-100px;left:-100px}
.two{width:250px;height:250px;bottom:-80px;right:-80px}
.login-box{width:400px;max-width:90%;background:white;padding:40px;border-radius:25px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:show .7s ease;z-index:2}
@keyframes show{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.logo{width:80px;height:80px;margin:0 auto 20px;border-radius:20px;display:flex;justify-content:center;align-items:center;font-size:35px;font-weight:800;color:white;background:linear-gradient(135deg,#007bff,#00d4ff)}
h1{text-align:center;color:#123;font-size:28px;margin-bottom:5px}
.subtitle{text-align:center;color:#777;font-size:14px;margin-bottom:30px}
.input-group{margin-bottom:20px}
label{display:block;font-size:14px;font-weight:600;color:#444;margin-bottom:8px}
input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #ddd;outline:none;font-size:15px}
input:focus{border-color:#008cff;box-shadow:0 0 0 3px rgba(0,140,255,.15)}
button{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#007bff,#00c6ff);color:white;font-size:16px;font-weight:700;cursor:pointer}
button:hover{transform:translateY(-2px)}
.options{display:flex;justify-content:space-between;font-size:13px;margin-bottom:25px}
.options a{color:#007bff;text-decoration:none}
.footer{text-align:center;font-size:12px;color:#999;margin-top:25px}
</style>
</head>
<body>
<div class="circle one"></div>
<div class="circle two"></div>

<div class="login-box">
<div class="logo">S</div>
<h1>Swimora</h1>
<p class="subtitle">Silakan login untuk masuk ke sistem</p>

<form id="loginForm">
<div class="input-group">
<label>Email / Username</label>
<input type="text" placeholder="Masukkan username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Masukkan password" required>
</div>

<div class="options">
<label><input type="checkbox"> Ingat saya</label>
<a href="#">Lupa password?</a>
</div>

<button type="submit">Login</button>
</form>

<div class="footer">© 2026 Swimora System</div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Login berhasil");
});
</script>
</body>
</html>
